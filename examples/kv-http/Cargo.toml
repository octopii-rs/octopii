[package]
name = "kv-http"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "kv-http"
path = "src/main.rs"

[dependencies]
octopii = { path = "../..", features = ["openraft"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
